    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')

            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
