name: Build Livreur APK Only

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app-livreur/**'

jobs:
  build-livreur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: ./app-livreur
        run: npm install

      - name: Clean and Prebuild
        working-directory: ./app-livreur
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: ./app-livreur/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nooreat-livreur-apk
          path: app-livreur/android/app/build/outputs/apk/debug/app-debug.apk
