name: Build Client APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client-pwa/**'
      - '.github/workflows/build-client-apk.yml'

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: ./client-pwa
        run: |
          rm -f package-lock.json
          npm install

      - name: Build Web
        working-directory: ./client-pwa
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Add Android Platform
        working-directory: ./client-pwa
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: ./client-pwa/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nooreat-client-apk
          path: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk
