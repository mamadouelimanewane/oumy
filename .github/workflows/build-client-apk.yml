name: Build Client APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client-pwa/**'
      - '.github/workflows/build-client-apk.yml'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-pwa/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Install Dependencies
        working-directory: ./client-pwa
        run: npm install
      
      - name: Build Web
        working-directory: ./client-pwa
        run: npm run build
      
      - name: Remove existing Android folder
        working-directory: ./client-pwa
        run: rm -rf android
      
      - name: Add Android Platform
        working-directory: ./client-pwa
        run: npx cap add android --verbose
        continue-on-error: true
      
      - name: Check if Android folder exists
        working-directory: ./client-pwa
        run: |
          if [ -d "android" ]; then
            echo "✅ Android folder created"
            ls -la android/
          else
            echo "❌ Android folder not created, trying alternative method..."
            mkdir -p android
            cd android
            # Create a minimal Android project structure
            cat > build.gradle << 'EOF'
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.1.0'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF
            mkdir -p app/src/main/assets
            cp -r ../dist/* app/src/main/assets/
            echo "Created minimal Android project"
          fi
      
      - name: Sync Capacitor
        working-directory: ./client-pwa
        run: npx cap sync android --verbose
      
      - name: Build APK
        working-directory: ./client-pwa/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-client-apk
          path: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: client-v${{ github.run_number }}
          name: SenFood Client v${{ github.run_number }}
          body: |
            ## SenFood Client APK
            
            Version ${{ github.run_number }}
            
            ### Installation
            1. Téléchargez l'APK ci-dessous
            2. Activez "Sources inconnues" dans les paramètres Android
            3. Installez l'APK
          files: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
