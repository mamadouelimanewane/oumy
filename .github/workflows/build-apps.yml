name: Build SenFood Apps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =====================
  # BUILD BACKEND
  # =====================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test
        env:
          JWT_SECRET: test_secret
          DB_HOST: localhost
          DB_NAME: test_db
      
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend/

  # =====================
  # BUILD CLIENT PWA APK
  # =====================
  build-client-apk:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-pwa/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Client Dependencies
        working-directory: ./client-pwa
        run: npm ci
      
      - name: Build Client
        working-directory: ./client-pwa
        run: npm run build
      
      - name: Setup Capacitor Android
        working-directory: ./client-pwa
        run: |
          npx cap sync android
          npx cap copy android
      
      - name: Build APK
        working-directory: ./client-pwa/android
        run: ./gradlew assembleDebug
      
      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-client-apk
          path: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk

  # =====================
  # BUILD ADMIN PANEL APK
  # =====================
  build-admin-apk:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel-admin/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Admin Dependencies
        working-directory: ./panel-admin
        run: npm ci
      
      - name: Build Admin
        working-directory: ./panel-admin
        run: npm run build
      
      - name: Setup Capacitor Android
        working-directory: ./panel-admin
        run: |
          npx cap sync android
          npx cap copy android
      
      - name: Build APK
        working-directory: ./panel-admin/android
        run: ./gradlew assembleDebug
      
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-admin-apk
          path: panel-admin/android/app/build/outputs/apk/debug/app-debug.apk

  # =====================
  # BUILD LIVREUR APK (Expo/EAS)
  # =====================
  build-livreur-apk:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-livreur/package-lock.json
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install Livreur Dependencies
        working-directory: ./app-livreur
        run: npm ci
      
      - name: Build APK with EAS
        working-directory: ./app-livreur
        run: eas build --platform android --profile preview --local --output ./senfood-livreur.apk
      
      - name: Upload Livreur APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-livreur-apk
          path: app-livreur/senfood-livreur.apk

  # =====================
  # CREATE RELEASE
  # =====================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-client-apk, build-admin-apk, build-livreur-apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All APKs
        uses: actions/download-artifact@v4
        with:
          path: ./apks
      
      - name: Rename APKs
        run: |
          mv ./apks/senfood-client-apk/app-debug.apk ./apks/SenFood-Client-v${{ github.run_number }}.apk
          mv ./apks/senfood-admin-apk/app-debug.apk ./apks/SenFood-Admin-v${{ github.run_number }}.apk
          mv ./apks/senfood-livreur-apk/senfood-livreur.apk ./apks/SenFood-Livreur-v${{ github.run_number }}.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: SenFood Release v${{ github.run_number }}
          body: |
            ## SenFood - Nouvelle version
            
            ### Applications Android
            - **Client** : SenFood-Client-v${{ github.run_number }}.apk
            - **Administrateur** : SenFood-Admin-v${{ github.run_number }}.apk
            - **Livreur** : SenFood-Livreur-v${{ github.run_number }}.apk
            
            ### Changements
            - Backend API avec JWT et PostgreSQL
            - Temps réel avec Socket.IO
            - Authentification sécurisée
          files: |
            ./apks/SenFood-Client-v${{ github.run_number }}.apk
            ./apks/SenFood-Admin-v${{ github.run_number }}.apk
            ./apks/SenFood-Livreur-v${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
