name: Build SenFood Apps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =====================
  # BUILD BACKEND
  # =====================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test || echo "Tests skipped - no test database"
        env:
          JWT_SECRET: test_secret
          DB_HOST: localhost
          DB_NAME: test_db
      
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend/

  # =====================
  # BUILD CLIENT PWA APK
  # =====================
  build-client-apk:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client-pwa/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Install Client Dependencies
        working-directory: ./client-pwa
        run: npm ci
      
      - name: Build Client
        working-directory: ./client-pwa
        run: npm run build
      
      - name: Setup Capacitor Android
        working-directory: ./client-pwa
        run: |
          npx cap sync android
          npx cap copy android
      
      - name: Create local.properties
        working-directory: ./client-pwa/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      
      - name: Build APK
        working-directory: ./client-pwa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-client-apk
          path: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # BUILD ADMIN PANEL APK
  # =====================
  build-admin-apk:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: panel-admin/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Install Admin Dependencies
        working-directory: ./panel-admin
        run: npm ci
      
      - name: Build Admin
        working-directory: ./panel-admin
        run: npm run build
      
      - name: Setup Capacitor Android
        working-directory: ./panel-admin
        run: |
          npx cap sync android
          npx cap copy android
      
      - name: Create local.properties
        working-directory: ./panel-admin/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      
      - name: Build APK
        working-directory: ./panel-admin/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-admin-apk
          path: panel-admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # BUILD LIVREUR APK (Expo/EAS)
  # =====================
  build-livreur-apk:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-livreur/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Install Livreur Dependencies
        working-directory: ./app-livreur
        run: npm ci
      
      - name: Build with Expo Prebuild
        working-directory: ./app-livreur
        run: |
          npx expo prebuild --platform android --clean
      
      - name: Create local.properties
        working-directory: ./app-livreur/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      
      - name: Build APK
        working-directory: ./app-livreur/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload Livreur APK
        uses: actions/upload-artifact@v4
        with:
          name: senfood-livreur-apk
          path: app-livreur/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # CREATE RELEASE
  # =====================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-client-apk, build-admin-apk, build-livreur-apk]
    if: github.ref == 'refs/heads/main' && always() && (needs.build-client-apk.result == 'success' || needs.build-admin-apk.result == 'success' || needs.build-livreur-apk.result == 'success')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All APKs
        uses: actions/download-artifact@v4
        with:
          path: ./apks
          merge-multiple: true
      
      - name: List downloaded files
        run: ls -la ./apks/
      
      - name: Rename APKs
        run: |
          mkdir -p ./releases
          if [ -f "./apks/app-debug.apk" ]; then
            cp ./apks/app-debug.apk ./releases/SenFood-Client-v${{ github.run_number }}.apk
          fi
          if [ -f "./apks/senfood-client-apk/app-debug.apk" ]; then
            cp ./apks/senfood-client-apk/app-debug.apk ./releases/SenFood-Client-v${{ github.run_number }}.apk
          fi
          if [ -f "./apks/senfood-admin-apk/app-debug.apk" ]; then
            cp ./apks/senfood-admin-apk/app-debug.apk ./releases/SenFood-Admin-v${{ github.run_number }}.apk
          fi
          if [ -f "./apks/senfood-livreur-apk/app-debug.apk" ]; then
            cp ./apks/senfood-livreur-apk/app-debug.apk ./releases/SenFood-Livreur-v${{ github.run_number }}.apk
          fi
          ls -la ./releases/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('./releases/*.apk') != ''
        with:
          tag_name: v${{ github.run_number }}
          name: SenFood Release v${{ github.run_number }}
          body: |
            ## SenFood - Nouvelle version
            
            ### Applications Android
            - **Client** : SenFood-Client-v${{ github.run_number }}.apk
            - **Administrateur** : SenFood-Admin-v${{ github.run_number }}.apk
            - **Livreur** : SenFood-Livreur-v${{ github.run_number }}.apk
            
            ### Changements
            - Backend API avec JWT et PostgreSQL
            - Temps réel avec Socket.IO
            - Authentification sécurisée
          files: ./releases/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
