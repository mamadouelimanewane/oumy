name: Build SenFood Apps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # =====================
  # BUILD CLIENT APK
  # =====================
  build-client-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-pwa/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Dependencies
        working-directory: ./client-pwa
        run: npm install

      - name: Build Web
        working-directory: ./client-pwa
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Clean and Add Android
        working-directory: ./client-pwa
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        working-directory: ./client-pwa
        run: npx cap sync android

      - name: Build APK
        working-directory: ./client-pwa/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: senfood-client-apk
          path: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # BUILD ADMIN APK
  # =====================
  build-admin-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel-admin/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Dependencies
        working-directory: ./panel-admin
        run: npm install

      - name: Build Web
        working-directory: ./panel-admin
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Clean and Add Android
        working-directory: ./panel-admin
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        working-directory: ./panel-admin
        run: npx cap sync android

      - name: Build APK
        working-directory: ./panel-admin/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: senfood-admin-apk
          path: panel-admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # BUILD DASHBOARD RESTAURANT APK
  # =====================
  build-dashboard-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard-restaurant/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Dependencies
        working-directory: ./dashboard-restaurant
        run: npm install

      - name: Build Web
        working-directory: ./dashboard-restaurant
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Clean and Add Android
        working-directory: ./dashboard-restaurant
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        working-directory: ./dashboard-restaurant
        run: npx cap sync android

      - name: Build APK
        working-directory: ./dashboard-restaurant/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: senfood-dashboard-apk
          path: dashboard-restaurant/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # BUILD LIVREUR APK
  # =====================
  build-livreur-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-livreur/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      
      - name: Install Dependencies
        working-directory: ./app-livreur
        run: npm install
      
      - name: Clean and Prebuild
        working-directory: ./app-livreur
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
      
      - name: Build APK
        working-directory: ./app-livreur/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: senfood-livreur-apk
          path: app-livreur/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # =====================
  # CREATE RELEASE
  # =====================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-client-apk, build-admin-apk, build-dashboard-apk, build-livreur-apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: ./apks
      
      - name: List Artifacts
        run: ls -la ./apks/
      
      - name: Prepare Release
        run: |
          mkdir -p releases
          for dir in ./apks/*/; do
            if [ -f "$dir/app-debug.apk" ]; then
              name=$(basename "$dir")
              cp "$dir/app-debug.apk" "releases/${name}.apk"
              echo "Added: ${name}.apk"
            fi
          done
          ls -la releases/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('releases/*.apk') != ''
        with:
          tag_name: v${{ github.run_number }}
          name: SenFood Release v${{ github.run_number }}
          body: |
            ## SenFood v${{ github.run_number }}
            
            ### APKs générés :
            - SenFood Client (PWA)
            - SenFood Restaurant (Dashboard)
            - SenFood Admin (Panel)
            - SenFood Livreur (Expo)
            
            ### Installation
            1. Téléchargez les APKs ci-dessous
            2. Activez "Sources inconnues" dans les paramètres Android
            3. Installez les APKs
          files: releases/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
