name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-client:
    name: Build Client APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client-pwa/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client-pwa
          npm install

      - name: Build Web Application
        run: |
          cd client-pwa
          npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Initialize Capacitor Android
        run: |
          cd client-pwa
          npx cap add android || npx cap sync android
          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Client APK
        run: |
          cd client-pwa/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: client-pwa/android/app/build/outputs/apk/debug/app-debug.apk

  build-livreur:
    name: Build Livreur APK (Expo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app-livreur/package-lock.json'

      - name: Install Livreur Dependencies
        run: |
          cd app-livreur
          npm install

      - name: Generate Android Project
        run: |
          cd app-livreur
          npx expo prebuild -p android --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Livreur APK
        run: |
          cd app-livreur/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Livreur APK
        uses: actions/upload-artifact@v4
        with:
          name: livreur-apk
          path: app-livreur/android/app/build/outputs/apk/debug/app-debug.apk
